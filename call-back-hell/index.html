<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Async Demo</title>
</head>

<body>
    <h1>Hello world JS</h1>

    <script>
        // =========================
        // CALLBACK FUNCTION
        // =========================
        const callback = (error, data) => {
            if (error) {
                console.log('>>> Error:', error);
            } else {
                console.log('>>> Data:', data);
            }
        };

        // =========================
        // FUNCTION CALL API (XMLHttpRequest)
        // =========================
        function getTodos(id, callback) {
            const request = new XMLHttpRequest();

            request.onreadystatechange = function () {
                if (this.readyState === 4 && request.status === 200) {
                    const data = JSON.parse(request.responseText);
                    callback(null, data);
                }

                if (this.readyState === 4 && request.status !== 200) {
                    callback('Something went wrong', null);
                }
            };

            request.open("GET", `https://jsonplaceholder.typicode.com/todos/${id}`, true);
            request.send();
        }

        // =========================
        // Fetch API Với Javascript - GET Data Từ API Siêu Đơn Giản
        // =========================
        fetch('https://jsonplaceholder.typicode.com/todos/1')
            .then(response => {
                return response.json()
            })
            .then(data => {
                console.log('>>> check fetch data:', data)
            })


        // =========================
        // 1. CHẠY SONG SONG (ASYNC)
        // =========================
        console.log("=== Run song song ===");

        getTodos(1, callback);
        getTodos(2, callback);

        // =========================
        // 2. CALLBACK LỒNG (TUẦN TỰ)
        // =========================

        // Cách viết này rất dài dòng và khó đọc, khó bảo trì, dễ bị lỗi nếu có nhiều cấp độ lồng nhau
        console.log("=== Run tuần tự (callback hell) ===");
        getTodos(1, (err, data1) => {
            if (err) {
                console.log('>>> Error:', err);
            } else {
                console.log('>>> Data:', data1);
                getTodos(2, (err, data2) => {
                    if (err) {
                        console.log('>>> Error:', err);
                    } else {
                        console.log('>>> Data 2:', data2);
                        getTodos(3, (err, data3) => {
                            if (err) {
                                console.log('>>> Error:', err);
                            } else {
                                console.log('>>> Data 3:', data3);
                            }
                        });
                    }
                });
            }
        });


        // Hoặc viết gọn hơn nhưng vẫn là callback hell
        console.log("=== Run tuần tự (callback hell) ===");

        getTodos(1, (err, data1) => {
            if (err) return console.log(err);
            console.log("Todo 1:", data1);

            getTodos(2, (err, data2) => {
                if (err) return console.log(err);
                console.log("Todo 2:", data2);
            });
        });

        // =========================
        // 3. PROMISE
        // =========================
        function getTodosPromise(id) {
            return new Promise((resolve, reject) => {
                getTodos(id, (err, data) => {
                    if (err) reject(err);
                    else resolve(data);
                });
            });
        }

        //promise getTodosPromise
        const getTodosPromise = () => {
            return new Promise((resolve, reject) => {
                // resolve({ name: 'roy', channel: 'eric' })
                reject('something wrongs')
            });
        }

        console.log("=== Run Promise ===");

        getTodosPromise(1)
            .then(data1 => {
                console.log("Promise 1:", data1);
                return getTodosPromise(2);
            })
            .then(data2 => {
                console.log("Promise 2:", data2);
            })
            .catch(err => console.log(err));


        // thực tế 
        function getTodosPromise(id, callback) {
            return new Promise((resolve, reject) => {
                var request = new XMLHttpRequest();

                request.onreadystatechange = function () {
                    if (this.readyState === 4) {
                        if (request.status === 200) {
                            const data = JSON.parse(request.responseText);

                            // dùng callback: callback(undefined, data);

                            // dùng promise
                            resolve(data);
                        } else {
                            // dùng callback: callback('Something went wrong', undefined);

                            // dùng promise
                            reject('Something went wrong');
                        }
                    }
                };

                request.open(
                    "GET",
                    `https://jsonplaceholder.typicode.com/todos/${id}`
                );

                request.withCredentials = true;
                request.send();
            });
        }

        // Cách gọi
        // 1. Dùng callback
        // nhớ dữ liệu truyền function getTodosPromise(id, callback) 
        getTodosPromise(1, (err, data1) => {
            if (err) {
                console.log('>>>', err);
            } else {
                console.log('>> get data:', data1);

                getTodosPromise(2, (err, data2) => {
                    if (err) {
                        console.log('>>>', err);
                    } else {
                        console.log('>> get data 2:', data2);
                    }
                });

            }
        });

        // 2. Dùng Promise(.then)
        // nhớ dữ liệu truyền function getTodosPromise(id, callback) 

        // Viết Promise chưa đúng cách (callback hell phiên bản Promise)
        getTodosPromise(1).then(data1 => {
            console.log('>> get data:', data1);

            getTodosPromise(2).then(data2 => {
                console.log('>> get data 2:', data2);

                getTodosPromise(3).then(data3 => {
                    console.log('>> get data 3:', data3)
                })
            })
        })

        // Cách viết đúng (Promise chaining) ==> khác cái trên ở chỗ có return getTodosPromise(2) để trả về Promise mới, nếu không có return thì sẽ bị lỗi vì .then() sẽ không nhận được Promise mới để tiếp tục xử lý
        getTodosPromise(1)
            .then(data1 => {
                console.log('>> get data:', data1);
                return getTodosPromise(2); // QUAN TRỌNG
            })
            .then(data2 => {
                console.log('>> get data 2:', data2);
                return getTodosPromise(3); // QUAN TRỌNG
            })
            .then(data3 => {
                console.log('>> get data 3:', data3);
            })
            .catch(err => {
                console.log('>>>', err);
            });


        // =========================
        // 4. ASYNC / AWAIT
        // =========================

        // Async & Await - Xử Lý Bất Đồng Bộ Sao Dễ Vậy
        async function runAsync() { // không khuyến khích viết kiểu này thay vào đó dùng arrow function 
            console.log("=== Run async/await ===");

            try {
                const data1 = await getTodosPromise(1);
                console.log("Async 1:", data1);

                const data2 = await getTodosPromise(2);
                console.log("Async 2:", data2);
            } catch (err) {
                console.log(err);
            }
        }

        runAsync();

        // dùng arrow function 
        // Hàm gọi API (có fetch bên trong)
        const getNewTodo = async (id) => {
            try {
                const response = await fetch(`https://jsonplaceholder.typicode.com/todos/${id}`)

                // check lỗi HTTP
                if (!response.ok) {
                    throw new Error('API error')
                }

                const data = await response.json()
                return data

            } catch (err) {
                console.log('>>> lỗi trong getNewTodo:', err)
                throw err // đẩy lỗi ra ngoài
            }
        }


        // ==========================
        // CÁCH 1: GỌI TUẦN TỰ
        // ==========================
        const runSequential = async () => {
            try {
                const data1 = await getNewTodo(1)
                console.log('data1:', data1)

                const data2 = await getNewTodo(2)
                console.log('data2:', data2)

                const data3 = await getNewTodo(3)
                console.log('data3:', data3)

            } catch (err) {
                console.log('>>> lỗi runSequential:', err)
            }
        }


        // ==========================
        // CÁCH 2: GỌI SONG SONG (CHUẨN NHẤT)
        // ==========================
        const runParallel = async () => {
            try {
                const [data1, data2, data3] = await Promise.all([
                    getNewTodo(1),
                    getNewTodo(2),
                    getNewTodo(3)
                ])

                console.log('data1:', data1)
                console.log('data2:', data2)
                console.log('data3:', data3)

            } catch (err) {
                console.log('>>> lỗi runParallel:', err)
            }
        }


        // ==========================
        // CHẠY HÀM
        // ==========================

        // chạy tuần tự
        runSequential()

        // chạy song song
        runParallel()



        // =========================
        // 5. CHẠY SONG SONG NHƯNG ĐỢI TẤT CẢ XONG
        // =========================
        console.log("=== Promise.all ===");

        Promise.all([
            getTodosPromise(1),
            getTodosPromise(2)
        ])
            .then(([data1, data2]) => {
                console.log("All done:", data1, data2);
            })
            .catch(err => console.log(err));

    </script>
</body>

</html>
